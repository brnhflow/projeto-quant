name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and the version I develop on.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # no floating major tag is published
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Types
        run: uv run --frozen python -m pyright
      - name: Tests
        run: uv run --frozen python -m pytest --cov --cov-report=term-missing

  cpp:
    name: C++ core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: C++ unit tests (CTest)
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp --parallel
          ctest --test-dir build/cpp --output-on-failure
      - name: Build the Python extension
        run: |
          uv sync --frozen
          uv pip install ./cpp
      - name: C++ against the NumPy reference
        env:
          QUANT_REQUIRE_CORE: "1"
        run: uv run --frozen --no-sync python -m pytest tests/test_core.py tests/test_var_models.py tests/test_rules.py tests/test_allocation.py -q
      - name: Benchmark
        run: uv run --frozen --no-sync python research/benchmark.py

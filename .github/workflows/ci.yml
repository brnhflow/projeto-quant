name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and the version I develop on.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Types
        run: uv run --frozen python -m pyright
      - name: Tests
        run: uv run --frozen python -m pytest --cov --cov-report=term-missing

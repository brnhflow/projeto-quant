[project]
# Provisional name. The import package (src/quant) is deliberately neutral so a
# rename only touches this line, the README title and the folder name.
name = "projeto-quant"
version = "0.0.1"
description = "Personal research toolkit for analysing my own portfolio: risk, scenarios, decision support."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bernardo" }]
dependencies = [
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7",
    "pyright>=1.1",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear: likely bugs
    "UP",           # modern syntax for the target version
    "SIM",          # simpler code
    "NPY",          # numpy-specific pitfalls
    "PD",           # pandas-specific pitfalls
    "N",            # naming
    "RUF",
    "D",            # docstrings (public API must explain itself)
]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
".claude/**" = ["D"]
"scripts/**" = ["E501"]  # HTML/SVG templates

# ---------------------------------------------------------------- pyright
# Type checker. (mypy is the usual choice, but its compiled parts are blocked by
# Windows Smart App Control on my machine; pyright runs on Node and is not.)
[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["quant"]
branch = true
